; PHP-FPM pool for tedem.dev: /etc/php/8.5/fpm/pool.d/tedem.conf (see deploy/README.md).
; Runs as the deploy user, who owns the code, so storage/ and bootstrap/cache need no
; extra permissions; nginx (www-data) talks to it through the socket.

[tedem]
user = deploy
group = www-data

listen = /run/php/php8.5-fpm-tedem.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[memory_limit] = 256M
php_admin_flag[expose_php] = off
