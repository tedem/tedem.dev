# nginx site for tedem.dev: /etc/nginx/sites-available/tedem.dev (see deploy/README.md).
# HTTPS with a Let's Encrypt certificate; plain HTTP and www redirect to https://tedem.dev.

server {
    listen 80;
    listen [::]:80;
    server_name tedem.dev www.tedem.dev;

    # Let's Encrypt renewals (certbot --webroot) answer from here, over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://tedem.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.tedem.dev;

    ssl_certificate /etc/letsencrypt/live/tedem.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tedem.dev/privkey.pem;

    return 301 https://tedem.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tedem.dev;

    root /var/www/tedem.dev/public;
    index index.php;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/tedem.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tedem.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers, HSTS included, come from the app (App\Http\Middleware\AddSecurityHeaders).

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Vite output: file names change with their content, so browsers may keep them for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm-tedem.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    # Any other .php file and dotfiles (.env, .git) are never served.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
